[package]
name = "attention-protocol"
version = "0.1.0"
edition = "2024"
authors = ["Allison Durham"]
description = "Strict Attention JSON-RPC wire types; use crate-root DTOs for envelopes, hello negotiation, IDs, versions, and canonical timestamps"
license = "MIT"
repository = "https://github.com/allisoneer/agentic_auxilary"
publish = false
autotests = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[[test]]
name = "envelopes"
path = "tests/envelopes.rs"

[[test]]
name = "hello"
path = "tests/hello.rs"

[[test]]
name = "errors"
path = "tests/errors.rs"

[[test]]
name = "ids"
path = "tests/ids.rs"

[[test]]
name = "time"
path = "tests/time.rs"

[[test]]
name = "values"
path = "tests/values.rs"

[[test]]
name = "resources"
path = "tests/resources.rs"

[[test]]
name = "mutations"
path = "tests/mutations.rs"

[[test]]
name = "sync"
path = "tests/sync.rs"

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "methods"
path = "tests/methods.rs"

[[test]]
name = "workers"
path = "tests/workers.rs"

[[test]]
name = "compatibility"
path = "tests/compatibility.rs"

[lints]
workspace = true

[package.metadata.repo]
role = "lib"
family = "attention"

[package.metadata.repo.integrations]
mcp = false
logging = false
napi = false
