[package]
name = "attention-turso"
version = "0.1.0"
edition = "2024"
authors = ["Allison Durham"]
description = "Native local Turso storage foundation for Attention"
license = "MIT"
repository = "https://github.com/allisoneer/agentic_auxilary"
publish = false
autotests = false

[dependencies]
attention-kernel = { version = "0.1.0", path = "../kernel" }
chrono = { workspace = true }
fs2 = "0.4"
futures = "0.3"
getrandom = "0.3"
rustix = { version = "1", features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
turso-db = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "ownership"
path = "tests/ownership.rs"

[[test]]
name = "path_security"
path = "tests/path_security.rs"

[[test]]
name = "migrations"
path = "tests/migrations.rs"

[[test]]
name = "crash"
path = "tests/crash.rs"

[[test]]
name = "errors"
path = "tests/errors.rs"

[[test]]
name = "wal"
path = "tests/wal.rs"

[[test]]
name = "backup"
path = "tests/backup.rs"

[[test]]
name = "exact_pin_gate"
path = "tests/exact_pin_gate.rs"

[[test]]
name = "codec_fixtures"
path = "tests/codec_fixtures.rs"

[[test]]
name = "reader_ports"
path = "tests/reader_ports.rs"

[[test]]
name = "reminder_schedule_port"
path = "tests/reminder_schedule_port.rs"

[[test]]
name = "delivery_port"
path = "tests/delivery_port.rs"

[[test]]
name = "delivery_checkpoint_port"
path = "tests/delivery_checkpoint_port.rs"

[[test]]
name = "commit_conformance"
path = "tests/commit_conformance.rs"

[[test]]
name = "restart_and_replay"
path = "tests/restart_and_replay.rs"

[[test]]
name = "snapshot_change_race"
path = "tests/snapshot_change_race.rs"

[[test]]
name = "semantic_crash"
path = "tests/semantic_crash.rs"

[[test]]
name = "security_and_diagnostics"
path = "tests/security_and_diagnostics.rs"

[lints]
workspace = true

[package.metadata.repo]
role = "lib"
family = "attention"

[package.metadata.repo.integrations]
mcp = false
logging = false
napi = false
