name: Published Versions Sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-versions-sync-main
  cancel-in-progress: false

jobs:
  sync-published-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit/push regenerated published-version metadata
      pull-requests: write # needed to open a fallback PR if main is ruleset-protected
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Generate GitHub token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.96.1
          cache: false

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          cache: false

      - name: Sync published-version contract, mise.toml, and mise.lock
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail

          if [ -z "$TAG" ]; then
            echo "::error::No release tag was provided."
            exit 1
          fi

          plan_json="$RUNNER_TEMP/published-versions-plan.json"
          cargo run -p xtask -- published-versions --tag "$TAG" --json --dry-run > "$plan_json"
          cat "$plan_json"

          managed="$(jq -r '.managed' "$plan_json")"
          if [ "$managed" != "true" ]; then
            echo "Tag $TAG is unmanaged; no-op for published-version sync."
            exit 0
          fi

          prerelease="$(jq -r '.is_prerelease' "$plan_json")"
          if [ "$EVENT_PRERELEASE" = "true" ] || [ "$prerelease" = "true" ]; then
            echo "Prerelease detected; no-op for published-version sync."
            exit 0
          fi

          mapfile -t required_assets < <(jq -r '.required_asset_names[]' "$plan_json")
          if [ "${#required_assets[@]}" -eq 0 ]; then
            echo "::error::Managed tag $TAG resolved to no required assets."
            exit 1
          fi

          release_json="$RUNNER_TEMP/release.json"
          found_assets="false"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --json isPrerelease,assets > "$release_json"; then
              if [ "$(jq -r '.isPrerelease' "$release_json")" = "true" ]; then
                echo "Prerelease GitHub release detected; no-op for published-version sync."
                exit 0
              fi

              missing_assets=()
              for asset in "${required_assets[@]}"; do
                if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' "$release_json" > /dev/null; then
                  missing_assets+=("$asset")
                fi
              done

              if [ "${#missing_assets[@]}" -eq 0 ]; then
                found_assets="true"
                break
              fi

              echo "Attempt $attempt: waiting for required release assets to appear for $TAG"
              printf 'Missing assets:\n%s\n' "${missing_assets[*]}"
            else
              echo "Attempt $attempt: failed to read GitHub release for $TAG"
            fi

            sleep 15
          done

          if [ "$found_assets" != "true" ]; then
            echo "::error::Required assets for $TAG did not appear after retries."
            exit 1
          fi

          cargo run -p xtask -- published-versions --tag "$TAG"
          cargo run -p xtask -- sync
          MISE_LOCKED=0 mise lock
          cargo run -p xtask -- verify --check

          changed_files="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          if [ -z "$changed_files" ]; then
            echo "No repository changes were required after processing $TAG."
            exit 0
          fi

          allowed_re='^(tools/published-versions\.toml|mise\.toml|mise\.lock)$'
          bad="$(printf '%s\n' "$changed_files" | grep -Ev "$allowed_re" || true)"
          if [ -n "$bad" ]; then
            echo "::error::published-versions sync modified unexpected files; refusing to commit"
            echo "$bad"
            exit 1
          fi

          git config user.name "published-versions-sync[bot]"
          git config user.email "published-versions-sync[bot]@users.noreply.github.com"
          git config --local credential.helper "!f() { if [ \"\$1\" = get ]; then echo \"username=x-access-token\"; echo \"password=\${GITHUB_TOKEN}\"; fi; }; f"
          while IFS= read -r path; do
            git add -- "$path"
          done <<< "$changed_files"
          git commit -m "chore(published-versions): sync $TAG [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:main"; then
              exit 0
            fi

            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Failed to rebase published-versions sync commit onto origin/main."
              exit 1
            fi
          done

          echo "Direct push to main failed after retries; opening a fallback PR."
          sync_branch="published-versions-sync/${TAG}-${GITHUB_RUN_ID}"
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${sync_branch}"

          pr_body="$RUNNER_TEMP/published-versions-pr-body.md"
          cat > "$pr_body" <<EOF
          Automated published-version sync for \`$TAG\`.

          Direct push to \`main\` was blocked by repository rules, so this workflow opened a PR instead.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$sync_branch" \
            --title "chore(published-versions): sync $TAG" \
            --body-file "$pr_body")"
          echo "Opened fallback PR: $pr_url"
